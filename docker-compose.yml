services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend-a
      - backend-b
      - ai-service

  backend-a:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://market_user:123456@mysql:3306/campus_market?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy

  backend-b:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://market_user:123456@mysql:3306/campus_market?charset=utf8mb4
      STARTUP_DELAY: "5"
    depends_on:
      mysql:
        condition: service_healthy

  ai-service:
    build: ./ai-service

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: campus_market
      MYSQL_USER: market_user
      MYSQL_PASSWORD: "123456"
      MYSQL_ROOT_PASSWORD: root123456
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
